name: ausgaben-rechner

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ausgaben-rechner
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    volumes:
      - ausgaben-data:/app/data
    restart: unless-stopped

volumes:
  ausgaben-data:
