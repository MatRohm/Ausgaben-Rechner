name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Prepare lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build image (pushed only on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Docker-Image

            Container abrufen:

            ```bash
            docker pull ${{ needs.build-and-push.outputs.image }}:${{ github.ref_name }}
            ```

            App starten (Daten bleiben im Volume erhalten):

            ```bash
            docker run -d \
              --name ausgaben-rechner \
              --restart unless-stopped \
              -p 3000:3000 \
              -v ausgaben-data:/app/data \
              ${{ needs.build-and-push.outputs.image }}:${{ github.ref_name }}
            ```

            Danach ist die App unter http://localhost:3000 erreichbar.

            Statt `${{ github.ref_name }}` kannst du auch `latest` verwenden, um immer das neueste Image zu ziehen:

            ```bash
            docker pull ${{ needs.build-and-push.outputs.image }}:latest
            ```
